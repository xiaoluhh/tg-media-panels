
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="媒体浏览器">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=media%20gallery%20app%20icon%20with%20camera%20and%20images&image_size=square">
    <title>媒体浏览器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #fff; overflow-x: hidden; }
        .install-banner {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 15px 20px;
            z-index: 9999;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .install-banner.show { display: flex; align-items: center; justify-content: space-between; }
        .install-banner-content { display: flex; align-items: center; gap: 15px; }
        .install-icon { font-size: 36px; }
        .install-text h3 { font-size: 16px; font-weight: 600; }
        .install-text p { font-size: 13px; opacity: 0.9; }
        .install-btn {
            padding: 10px 20px;
            background: #fff;
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .install-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .container { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; padding-top: 70px; }
        h1 { font-size: 40px; font-weight: 700; }
        .filter-btns { display: flex; gap: 10px; }
        .filter-btn {
            padding: 10px 24px;
            background: #333;
            border: none;
            color: #888;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .filter-btn:hover { background: #444; color: #fff; }
        .filter-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .action-btns { display: flex; gap: 10px; margin-left: auto; }
        .action-btn { 
            padding: 10px 20px; 
            background: #333; 
            border: none; 
            color: #888; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600; 
            transition: all 0.2s ease; 
        }
        .action-btn:hover { background: #444; color: #fff; }
        .action-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        
        /* 右上角选择按钮 */
        #selectModeBtn { 
            position: fixed; 
            top: 15px; 
            right: 15px; 
            z-index: 1000;
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: #fff;
            padding: 8px 16px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
            font-size: 14px;
        }
        #selectModeBtn:hover { transform: scale(1.05); }
        
        /* 右下角删除按钮 */
        #deleteBtn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            z-index: 1000; 
            background: linear-gradient(135deg, #e74c3c, #c0392b); 
            color: #fff;
            padding: 8px 16px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(231,76,60,0.4);
            font-size: 14px;
        }
        #deleteBtn:hover { transform: scale(1.05); }
        .date-section { margin-bottom: 30px; }
        .date-header { font-size: 18px; font-weight: 600; padding: 12px 0; color: #888; display: flex; align-items: center; gap: 10px; }
        .photo-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; }
        .photo-item { aspect-ratio: 1; overflow: hidden; cursor: pointer; background: #1a1a1a; position: relative; user-select: none; transition: transform 0.1s ease; }
        .photo-item:active { transform: scale(0.95); }
        .photo-item.long-press { transform: scale(0.9); opacity: 0.7; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; image-rendering: -webkit-optimize-contrast; }
        .photo-item.selected { outline: 3px solid #667eea; z-index: 10; }
        .photo-item.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            z-index: 20;
        }
        .video-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .play-indicator {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #111;
        }
        .play-indicator::before { content: '▶'; margin-left: 3px; }
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: none; justify-content: center; align-items: center; z-index: 1000; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .lightbox.active { display: flex; }
        .lightbox-content { position: relative; width: 95vw; height: 90vh; display: flex; align-items: center; justify-content: center; background: #000; }
        .lightbox-content img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
        .lightbox-content video { width: 100%; height: 100%; object-fit: contain; }
        .lightbox-content img.zoomed { cursor: zoom-out; }
        /* ---- 自定义视频控制条 ---- */
        .video-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 30px 16px 12px;
            opacity: 0; pointer-events: none;
            display: flex;
            align-items: center; gap: 10px;
            z-index: 1020;
            transition: opacity 0.3s;
        }
        .video-controls.visible { opacity: 1; pointer-events: auto; }
        .video-controls .vc-play {
            width: 36px; height: 36px; flex-shrink: 0;
            background: rgba(255,255,255,0.9); border: none; border-radius: 50%;
            cursor: pointer; font-size: 16px; color: #111;
            display: flex; align-items: center; justify-content: center;
        }
        .video-controls .vc-time {
            color: #fff; font-size: 13px; font-family: monospace;
            flex-shrink: 0; min-width: 90px; text-align: center;
        }
        .video-controls .vc-progress {
            flex: 1; height: 6px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.2); border-radius: 3px;
            outline: none; cursor: pointer;
        }
        .video-controls .vc-progress::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #fff;
            box-shadow: 0 0 6px rgba(0,0,0,0.5); cursor: pointer;
        }
        .video-controls .vc-progress::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%;
            background: #fff; border: none; cursor: pointer;
        }
        /* 移动端更大的拖拽点 */
        @media (max-width: 900px) {
            .video-controls .vc-progress { height: 8px; }
            .video-controls .vc-progress::-webkit-slider-thumb { width: 22px; height: 22px; }
        }
        .video-error { text-align: center; color: #888; padding: 20px; }
        .video-error button { margin-top: 10px; padding: 10px 20px; background: #333; border: none; color: #fff; border-radius: 8px; cursor: pointer; }
        .lightbox-close { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; cursor: pointer; transition: all 0.2s; z-index: 1010; }
        .lightbox-close:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }
        .lightbox-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 60px; color: #fff; cursor: pointer; transition: background 0.2s; z-index: 1010; }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox-nav.prev { left: 20px; }
        .lightbox-nav.next { right: 20px; }
        .lightbox-counter { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; z-index: 1010; }
        .lightbox-delete { 
            position: fixed; 
            top: 20px; 
            right: 80px; 
            width: 50px; 
            height: 50px; 
            background: rgba(231,76,60,0.8); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            z-index: 1010;
            box-shadow: 0 4px 12px rgba(231,76,60,0.4);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        .lightbox-delete:hover { 
            background: rgba(231,76,60,1); 
            transform: scale(1.1); 
        }
        .close-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 14px; white-space: nowrap; z-index: 1010; }
        .delete-toast { position: fixed; top: 15%; left: 50%; transform: translate(-50%, 0); background: rgba(0,0,0,0.85); color: #fff; padding: 16px 32px; border-radius: 12px; font-size: 18px; font-weight: 600; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .delete-toast.show { opacity: 1; }

        .select-hint { background: rgba(102,126,234,0.2); padding: 8px 16px; border-radius: 20px; font-size: 14px; }
        .zoom-hint { background: rgba(102,126,234,0.2); padding: 8px 16px; border-radius: 20px; font-size: 14px; margin-left: auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 1400px) { .photo-grid { grid-template-columns: repeat(7, 1fr); } }
        @media (max-width: 1200px) { .photo-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 900px) { .photo-grid { grid-template-columns: repeat(5, 1fr); } .play-indicator { width: 32px; height: 32px; } }
        @media (max-width: 600px) { 
            .photo-grid { grid-template-columns: repeat(4, 1fr); } 
            .filter-btn { padding: 8px 16px; font-size: 14px; } 
            .action-btn { padding: 8px 16px; font-size: 14px; }
            .play-indicator { width: 28px; height: 28px; font-size: 14px; } 
            .lightbox-close { width: 45px; height: 45px; font-size: 26px; top: 15px; right: 15px; }
            .lightbox-nav { width: 55px; height: 55px; font-size: 28px; }
            .lightbox-nav.prev { left: 10px; }
            .lightbox-nav.next { right: 10px; }
            h1 { font-size: 28px; }
            .container { padding: 15px; }
            .header { gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="install-banner" id="installBanner">
        <div class="install-banner-content">
            <div class="install-icon">📸</div>
            <div class="install-text">
                <h3>安装到主屏幕</h3>
                <p>像APP一样使用媒体浏览器</p>
            </div>
        </div>
        <button class="install-btn" id="installBtn">安装</button>
        <button class="install-close" id="installClose">×</button>
    </div>
    
    <button class="action-btn" id="selectModeBtn" style="position:fixed;top:20px;right:20px;z-index:1000;">选择</button>
    <div class="container" id="mainContainer" style="display:none;">
        <div class="header">
            <h1>📸 照片</h1>
            <div class="filter-btns">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="photo">照片</button>
                <button class="filter-btn" data-filter="video">视频</button>
            </div>
            <div class="action-btns">
                <button class="action-btn" id="selectAllBtn" style="display:none;">全选</button>
                <button class="action-btn delete" id="deleteBtn" style="display:none;">删除</button>
            </div>
        </div>
        <div id="content"></div>
    </div>
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" id="lightboxCloseBtn">×</div>
        <div class="lightbox-nav prev" id="navPrev">‹</div>
        <div class="lightbox-content" id="lightboxContent"></div>
        <div class="lightbox-nav next" id="navNext">›</div>
        <div class="lightbox-counter" id="lightboxCounter"></div>
        <div class="lightbox-delete" id="lightboxDeleteBtn" title="删除此图片">🗑️</div>
        <div class="close-hint" id="lightboxHint">双指缩放 | 点击关闭 | 滑动翻页</div>
    </div>
    <div class="delete-toast" id="deleteToast">✅ 删除成功！</div>
    <script>
        let videoGen = 0;  // 视频代际计数器，防止僵尸音频
        let deferredPrompt;
        let allMedia = [], filteredMedia = [], currentIndex = 0, currentFilter = 'all';
        let touchStartX = 0, touchStartY = 0, touchStartTime = 0, ignoreSwipe = false;
        const EDGE_THRESHOLD = 70;
        const SWIPE_THRESHOLD = 80;
        const TIME_THRESHOLD = 350;
        let selectMode = false, selectedFiles = new Set();
        let currentScale = 1, initialPinchScale = 1;
        
        function safePath(p) {
            return p.split('/').map(encodeURIComponent).join('/');
        }
        
        function showDeleteToast() {
            const toast = document.getElementById('deleteToast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1000);
        }
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallBanner();
        });
        
        function showInstallBanner() {
            const banner = document.getElementById('installBanner');
            const dismissed = localStorage.getItem('installDismissed');
            if (!dismissed) {
                banner.classList.add('show');
            }
        }
        
        document.getElementById('installBtn').addEventListener('click', async () => {
            const banner = document.getElementById('installBanner');
            banner.classList.remove('show');
            
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('用户接受了安装');
                }
                deferredPrompt = null;
            }
        });
        
        document.getElementById('installClose').addEventListener('click', () => {
            document.getElementById('installBanner').classList.remove('show');
            localStorage.setItem('installDismissed', 'true');
        });
        
        let loadingMore = false, allDatesLoaded = false, dateIndex = 0, allDates = [];
        async function load() {
            try {
                // 如果有预注入数据，直接秒开
                if (window.__INIT__) {
                    allDates = window.__INIT__.dates;
                    if (window.__INIT__.firstFiles) {
                        window.__INIT__.firstFiles.forEach(f => allMedia.push(f));
                    }
                    dateIndex = 1;
                    filterMedia();
                    render();
                    document.getElementById('mainContainer').style.display = 'block';
                    loadRemainingDates();
                    return;
                }
                
                // 降级：API 加载
                const res = await fetch('/api/dates');
                const data = await res.json();
                allDates = data.dates;
                
                // 先加载第一个日期，立即显示
                if (allDates.length > 0) {
                    const d = await fetch('/api/files/' + allDates[0] + '?page=1');
                    const fd = await d.json();
                    fd.files.forEach(f => allMedia.push({...f, date: allDates[0]}));
                    dateIndex = 1;
                }
                
                filterMedia();
                render();
                document.getElementById('mainContainer').style.display = 'block';
                
                // 后台加载剩余
                loadRemainingDates();
            } catch (e) {
                console.error('Load error:', e);
                document.getElementById('mainContainer').style.display = 'block';
            }
        }
        
        async function loadRemainingDates() {
            if (loadingMore || dateIndex >= allDates.length) { allDatesLoaded = true; return; }
            loadingMore = true;
            try {
                let count = 0;
                while (dateIndex < allDates.length) {
                    const date = allDates[dateIndex];
                    let p = 1, hasMore = true;
                    while (hasMore) {
                        const r = await fetch('/api/files/' + date + '?page=' + p);
                        const d = await r.json();
                        d.files.forEach(f => allMedia.push({...f, date}));
                        hasMore = p < d.pages;
                        p++;
                    }
                    dateIndex++;
                    count++;
                    // 每加载3个日期更新一次显示
                    if (count % 3 === 0) { filterMedia(); render(); }
                }
                allDatesLoaded = true;
                filterMedia(); render();
            } catch (e) { console.error(e); }
            loadingMore = false;
        }
        
        function filterMedia() {
            if (currentFilter === 'all') filteredMedia = allMedia;
            else if (currentFilter === 'photo') filteredMedia = allMedia.filter(m => !m.isVideo);
            else filteredMedia = allMedia.filter(m => m.isVideo);
        }
        
        function render() {
            let html = '', currentDate = '';
            filteredMedia.forEach((item, i) => {
                if (item.date !== currentDate) {
                    if (currentDate) html += '</div></div>';
                    currentDate = item.date;
                    let dateHtml = '<div class="date-section"><div class="date-header">' + currentDate;
                    if (selectMode) {
                        dateHtml += '<span class="select-hint">点击选择 | 已选 ' + selectedFiles.size + ' 个</span>';
                    }
                    dateHtml += '</div><div class="photo-grid">';
                    html += dateHtml;
                }
                const thumbUrl = safePath(item.path);
                const encodedPath = encodeURIComponent(item.path);
                const isSelected = selectedFiles.has(item.path);
                const selectedClass = isSelected ? ' selected' : '';
                if (item.isVideo) {
                    html += '<div class="photo-item' + selectedClass + '" data-index="' + i + '" data-path="' + encodeURIComponent(item.path) + '">';
                    html += '<img src="/thumb/' + thumbUrl + '" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23333%22 width=%22200%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23888%22 font-size=%2230%22>▶</text></svg>\'">';
                    html += '<div class="video-overlay"><div class="play-indicator"></div></div>';
                    html += '</div>';
                } else {
                    html += '<div class="photo-item' + selectedClass + '" data-index="' + i + '" data-path="' + encodeURIComponent(item.path) + '"><img src="/thumb/' + thumbUrl + '" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23333%22 width=%22200%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23888%22 font-size=%2224%22>🖼</text></svg>\'"></div>';
                }
            });
            if (currentDate) html += '</div></div>';
            document.getElementById('content').innerHTML = html;
            
            document.querySelectorAll('.photo-item').forEach(el => {
                let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
                let touchMoved = false;
                let lastTapTime = 0;
                let swipeSelectActive = false;
                let swipeAddMode = true;  // true=选中, false=取消选中
                let swipedItems = new Set();
                
                // 触摸开始
                el.addEventListener('touchstart', (e) => {
                    if (e.touches.length !== 1) return;
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    touchStartTime = Date.now();
                    touchMoved = false;
                    swipeSelectActive = false;
                    swipedItems = new Set();
                });
                
                // 触摸移动
                el.addEventListener('touchmove', (e) => {
                    if (e.touches.length !== 1) return;
                    const touch = e.touches[0];
                    const deltaX = Math.abs(touch.clientX - touchStartX);
                    const deltaY = Math.abs(touch.clientY - touchStartY);
                    if (deltaX > 8 || deltaY > 8) {
                        touchMoved = true;
                        // 选择模式下：滑动选中
                        if (selectMode) {
                            e.preventDefault();
                            if (!swipeSelectActive) {
                                // 首次移动：决定是选中还是取消
                                swipeSelectActive = true;
                                const path = decodeURIComponent(el.dataset.path);
                                swipeAddMode = !selectedFiles.has(path);
                            }
                            // 用 elementFromPoint 找手指下的 photo-item
                            const target = document.elementFromPoint(touch.clientX, touch.clientY);
                            const item = target ? target.closest('.photo-item') : null;
                            if (item && item.dataset.path) {
                                const p = decodeURIComponent(item.dataset.path);
                                if (!swipedItems.has(p)) {
                                    swipedItems.add(p);
                                    if (swipeAddMode) {
                                        selectedFiles.add(p);
                                        item.classList.add('selected');
                                    } else {
                                        selectedFiles.delete(p);
                                        item.classList.remove('selected');
                                    }
                                    updateActionButtons();
                                }
                            }
                        }
                    }
                });
                
                // 触摸结束
                el.addEventListener('touchend', (e) => {
                    if (swipeSelectActive) return;  // 滑动选中了，不触发点击
                    if (touchMoved) return;
                    
                    const touch = e.changedTouches[0];
                    const deltaX = Math.abs(touch.clientX - touchStartX);
                    const deltaY = Math.abs(touch.clientY - touchStartY);
                    const deltaTime = Date.now() - touchStartTime;
                    
                    // 移动距离小（<8px）且时间短（<250ms）才算点击
                    if (deltaX < 8 && deltaY < 8 && deltaTime < 250) {
                        e.preventDefault();
                        lastTapTime = Date.now();
                        handleTap();
                    }
                });
                
                // 点击处理函数
                const handleTap = () => {
                    if (selectMode) {
                        const path = decodeURIComponent(el.dataset.path);
                        if (selectedFiles.has(path)) {
                            selectedFiles.delete(path);
                            el.classList.remove('selected');
                        } else {
                            selectedFiles.add(path);
                            el.classList.add('selected');
                        }
                        updateActionButtons();
                    } else {
                        currentIndex = parseInt(el.dataset.index);
                        openLightbox();
                    }
                };
                
                // 桌面端鼠标点击（防止移动端双触发）
                el.addEventListener('click', (e) => {
                    // 如果300ms内刚有过触摸点击，忽略这个合成click事件
                    if (Date.now() - lastTapTime < 300) return;
                    handleTap();
                });
            });
        }
        
        function toggleSelectMode() {
            selectMode = !selectMode;
            if (!selectMode) {
                selectedFiles.clear();
            }
            updateActionButtons();
            render();
        }
        
        function updateActionButtons() {
            const selectModeBtn = document.getElementById('selectModeBtn');
            const selectAllBtn = document.getElementById('selectAllBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            
            if (selectMode) {
                selectModeBtn.classList.add('active');
                selectModeBtn.textContent = '取消';
                selectAllBtn.style.display = 'block';
                
                if (selectedFiles.size > 0) {
                    deleteBtn.style.display = 'block';
                    deleteBtn.textContent = '🗑️ 删除 (' + selectedFiles.size + ')';
                    deleteBtn.style.opacity = '1';
                } else {
                    deleteBtn.style.display = 'block';
                    deleteBtn.textContent = '🗑️ 删除';
                    deleteBtn.style.opacity = '0.5';
                }
            } else {
                selectModeBtn.classList.remove('active');
                selectModeBtn.textContent = '选择';
                selectAllBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
                deleteBtn.style.opacity = '1';
            }
        }
        
        function selectAll() {
            if (selectedFiles.size === filteredMedia.length) {
                selectedFiles.clear();
            } else {
                selectedFiles.clear();
                filteredMedia.forEach(item => selectedFiles.add(item.path));
            }
            render();
            updateActionButtons();
        }
        
        async function deleteSelected() {
            if (selectedFiles.size === 0) return;
            
            try {
                const filesToDelete = Array.from(selectedFiles);
                console.log('准备删除的文件：', filesToDelete);
                
                const response = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: filesToDelete })
                });
                
                const data = await response.json();
                console.log('删除结果：', data);
                
                if (data.deleted > 0) {
                    showDeleteToast();
                    // 直接从数组里移除已删除的文件，不重新加载页面
                    const deletedSet = new Set(filesToDelete);
                    allMedia = allMedia.filter(m => !deletedSet.has(m.path));
                    filterMedia();
                    selectedFiles.clear();
                    selectMode = false;
                    updateActionButtons();
                    const scrollY = window.scrollY;
                    render();
                    window.scrollTo(0, scrollY);
                }
            } catch (e) {
                console.error('Delete error:', e);
                alert('删除失败！请重试。错误信息：' + e.message);
            }
        }
        
        function openLightbox() {
            videoGen++;  // 新一代视频
            const myGen = videoGen;
            const item = filteredMedia[currentIndex];
            const thumbUrl = safePath(item.path);
            
            // 彻底杀死旧视频：移除DOM + 清src + 清source
            const oldVideo = document.querySelector('.lightbox-content video');
            if (oldVideo) {
                oldVideo.onloadeddata = null;  // 防止僵尸回调
                oldVideo.onerror = null;
                oldVideo.pause();
                oldVideo.src = '';
                oldVideo.srcObject = null;
                while (oldVideo.firstChild) oldVideo.removeChild(oldVideo.firstChild);
                oldVideo.load();
                oldVideo.remove();
            }
            clearVideoControls();
            document.getElementById('lightboxContent').innerHTML = '';
            document.getElementById('lightboxCounter').textContent = (currentIndex + 1) + ' / ' + filteredMedia.length;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
            currentScale = 1;
            
            if (item.isVideo) {
                const video = document.createElement('video');
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.preload = 'auto';
                video.loop = true;
                video.style.background = '#000';
                const source = document.createElement('source');
                source.src = '/api/file/' + thumbUrl;
                source.type = 'video/mp4';
                video.appendChild(source);
                video.onloadeddata = () => {
                    if (videoGen !== myGen) { video.muted = true; video.pause(); return; }
                    video.muted = false;
                    video.play();
                };
                video.onerror = () => {
                    document.getElementById('lightboxContent').innerHTML = '<div class="video-error">无法播放此视频<br><button onclick="navigate(1)">下一个</button></div>';
                };
                document.getElementById('lightboxContent').appendChild(video);
                setupVideoControls(video);
            } else {
                const imgContainer = document.createElement('div');
                imgContainer.style.cssText = 'width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden;';
                
                const img = document.createElement('img');
                img.src = '/api/file/' + thumbUrl;
                img.style.cssText = 'max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.2s ease;';
                
                img.onerror = () => {
                    imgContainer.innerHTML = '<div class="video-error" style="color:#fff;">无法加载此图片<br><small>文件可能已损坏或过大</small><br><button onclick="navigate(1)">下一个</button></div>';
                };
                
                imgContainer.appendChild(img);
                document.getElementById('lightboxContent').appendChild(imgContainer);
                
                imgContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
                imgContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
                imgContainer.addEventListener('touchend', handleTouchEnd);
                
                img.addEventListener('click', (e) => {
                    if (e.touches && e.touches.length > 1) return;
                    
                    if (currentScale === 1) {
                        currentScale = 2;
                        img.style.transform = 'scale(' + currentScale + ')';
                        img.classList.add('zoomed');
                    } else {
                        currentScale = 1;
                        img.style.transform = 'scale(' + currentScale + ')';
                        img.classList.remove('zoomed');
                    }
                });
            }
        }
        
        function handleTouchStart(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                initialPinchScale = currentScale;
                const currentDistance = Math.hypot(
                    touch2.clientX - touch1.clientX,
                    touch2.clientY - touch1.clientY
                );
                window._pinchDistance = currentDistance;
            }
        }
        
        function handleTouchMove(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const currentDistance = Math.hypot(
                    touch2.clientX - touch1.clientX,
                    touch2.clientY - touch1.clientY
                );
                
                if (window._pinchDistance) {
                    const scale = (currentDistance / window._pinchDistance) * initialPinchScale;
                    currentScale = Math.max(0.5, Math.min(scale, 5));
                    
                    const img = document.querySelector('.lightbox-content img');
                    if (img) {
                        img.style.transform = 'scale(' + currentScale + ')';
                        img.classList.toggle('zoomed', currentScale > 1);
                    }
                }
            }
        }
        
        function handleTouchEnd() {
            window._pinchDistance = null;
            if (currentScale < 1) {
                currentScale = 1;
                const img = document.querySelector('.lightbox-content img');
                if (img) {
                    img.style.transform = 'scale(' + currentScale + ')';
                    img.classList.remove('zoomed');
                }
            }
        }
        
        // ---- 自定义视频控制条 ----
        let vcVideo = null, vcSeeking = false;
        function setupVideoControls(video) {
            vcVideo = video;
            const ctrl = document.createElement('div');
            ctrl.className = 'video-controls visible';
            ctrl.innerHTML = `
                <button class="vc-play" id="vcPlay">❚❚</button>
                <input type="range" class="vc-progress" id="vcProgress" min="0" max="1000" value="0">
                <span class="vc-time" id="vcTime">00:00 / 00:00</span>`;
            document.getElementById('lightboxContent').appendChild(ctrl);
            
            const progress = ctrl.querySelector('.vc-progress');
            const playBtn = ctrl.querySelector('.vc-play');
            const timeEl = ctrl.querySelector('.vc-time');
            
            let hideTimer;
            function show() { ctrl.style.opacity = '1'; clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (!video.paused) ctrl.style.opacity = '0'; }, 3000); }
            function fmt(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
            
            video.addEventListener('timeupdate', () => {
                if (!vcSeeking && video.duration) progress.value = (video.currentTime / video.duration) * 1000;
                timeEl.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration || 0);
            });
            video.addEventListener('play', () => { playBtn.textContent = '❚❚'; });
            video.addEventListener('pause', () => { playBtn.textContent = '▶'; show(); });
            video.addEventListener('ended', () => { playBtn.textContent = '▶'; show(); });
            
            playBtn.onclick = (e) => { e.stopPropagation(); video.paused ? video.play() : video.pause(); };
            progress.onclick = (e) => e.stopPropagation();
            
            progress.addEventListener('input', () => { vcSeeking = true; timeEl.textContent = fmt((progress.value/1000)*video.duration) + ' / ' + fmt(video.duration); });
            progress.addEventListener('change', () => { video.currentTime = (progress.value/1000)*video.duration; vcSeeking = false; });
            
            video.addEventListener('click', () => video.paused ? video.play() : video.pause());
            video.addEventListener('mousemove', show);
            video.addEventListener('touchstart', show);
            ctrl.addEventListener('mousemove', show);
            ctrl.addEventListener('touchstart', (e) => { e.stopPropagation(); show(); });
            ctrl.addEventListener('click', (e) => e.stopPropagation());
            
            show();
        }
        function clearVideoControls() {
            const ctrl = document.querySelector('.video-controls');
            if (ctrl) ctrl.remove();
            vcVideo = null;
        }
        
        function closeLightbox() { 
            const video = document.querySelector('.lightbox-content video');
            if (video) video.pause();
            clearVideoControls();
            document.getElementById('lightbox').classList.remove('active'); 
            document.body.style.overflow = '';
            // 滚动到当前查看的图片位置
            if (filteredMedia.length > 0 && currentIndex >= 0) {
                const currentItem = filteredMedia[Math.min(currentIndex, filteredMedia.length - 1)];
                const el = document.querySelector(`[data-path="${encodeURIComponent(currentItem.path)}"]`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
        
        function navigate(delta) { 
            currentIndex = (currentIndex + delta + filteredMedia.length) % filteredMedia.length; 
            openLightbox(); 
        }
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                filterMedia();
                currentIndex = 0;
                if (selectMode) {
                    selectedFiles.clear();
                }
                render();
            });
        });
        
        document.getElementById('selectModeBtn').addEventListener('click', toggleSelectMode);
        document.getElementById('selectAllBtn').addEventListener('click', selectAll);
        document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
        
        document.getElementById('lightboxCloseBtn').addEventListener('click', closeLightbox);
        document.getElementById('navPrev').addEventListener('click', () => navigate(-1));
        document.getElementById('navNext').addEventListener('click', () => navigate(1));
        
        // 大图查看页删除按钮
        document.getElementById('lightboxDeleteBtn').addEventListener('click', async () => {
            const currentItem = filteredMedia[currentIndex];
            if (!currentItem) return;
            
            try {
                const response = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: [currentItem.path] })
                });
                
                const data = await response.json();
                
                if (data.deleted > 0) {
                    showDeleteToast();
                    
                    // 从列表中移除
                    const idxToRemove = allMedia.findIndex(m => m.path === currentItem.path);
                    if (idxToRemove > -1) {
                        allMedia.splice(idxToRemove, 1);
                    }
                    
                    // 重新过滤
                    filterMedia();
                    
                    // 关闭查看器
                    closeLightbox();
                    
                    // 如果还有图片，显示下一张
                    if (filteredMedia.length > 0) {
                        currentIndex = Math.min(currentIndex, filteredMedia.length - 1);
                        openLightbox();
                    } else {
                        // 没有图片了，刷新页面
                        await load();
                    }
                } else {
                    alert('❌ 删除失败！请重试。');
                }
            } catch (e) {
                console.error('Delete error:', e);
                alert('❌ 删除失败！请重试。');
            }
        });
        
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });
        
        document.getElementById('lightboxContent').addEventListener('click', (e) => {
            if (!document.querySelector('.lightbox-content video')) closeLightbox();
        });
        
        document.addEventListener('keydown', (e) => { 
            if (!document.getElementById('lightbox').classList.contains('active')) return; 
            if (e.key === 'Escape') closeLightbox(); 
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigate(-1); 
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1); 
        });
        
        window.addEventListener('wheel', (e) => { 
            if (!document.getElementById('lightbox').classList.contains('active')) return; 
            e.preventDefault(); 
            navigate(e.deltaY > 0 ? 1 : -1); 
        }, { passive: false });
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
            const windowWidth = window.innerWidth;
            ignoreSwipe = touchStartX < EDGE_THRESHOLD || touchStartX > windowWidth - EDGE_THRESHOLD;
        }, { passive: true });
        
        document.addEventListener('touchend', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (ignoreSwipe) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const deltaTime = Date.now() - touchStartTime;
            const deltaX = touchStartX - touchEndX;
            const deltaY = touchStartY - touchEndY;
            
            if (deltaTime > TIME_THRESHOLD) return;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD && Math.abs(deltaX) > Math.abs(deltaY)) {
                navigate(deltaX > 0 ? 1 : -1);
            } else if (Math.abs(deltaY) > SWIPE_THRESHOLD) {
                navigate(deltaY > 0 ? 1 : -1);
            }
        }, { passive: false });
        
        load();
    </script>
</body>
</html>
